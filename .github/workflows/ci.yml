name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 安装 Python 依赖
        run: python -m pip install --quiet --upgrade pip numpy matplotlib

      - name: 单元测试（含导出脚本实跑）
        run: npm test

      - name: 打包单文件版
        run: npm run build

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node-version }}
          path: dist/
          retention-days: 7
